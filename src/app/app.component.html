<app-header
  [isAuthenticated]="isAuthenticated"
  [appVersion]="appVersion"
  [selectedTab]="selectedTab"
  [tabs]="tabs"
  [isModalActive]="isModalActive()"
  (loginClick)="toggleLoginPanel()"
  (logoutClick)="logout()"
  (tabSelected)="selectTab($event)"
  (headerDoubleClick)="onHeaderDoubleClick($event)"
></app-header>

<app-login-modal
  [visible]="showLoginPanel"
  [email]="authEmail"
  [password]="authPassword"
  [error]="authError"
  (emailChange)="authEmail = $event"
  (passwordChange)="authPassword = $event"
  (submit)="isAuthenticated ? logout() : login($event)"
  (close)="toggleLoginPanel()"
></app-login-modal>

<main class="page">
  <section class="list-panel" (dblclick)="onListPanelDoubleClick($event)">
    <div class="list-header" (dblclick)="onHeaderDoubleClick($event)" [ngStyle]="{ 'z-index': isModalActive() ? 10 : 50 }">
      <div class="list-header-row">
        <div>
          <p class="section-label">Fire Links -- <b>{{selectedTab.toUpperCase()}}</b></p>
        </div>
        <div class="list-actions">
          <button
            type="button"
            class="scroll-top-btn"
            [hidden]="isModalActive()"
            (click)="scrollToTop()"
            aria-label="Scroll to top">
            ↑
          </button>
          <button class="btn btn-lu2" type="button" (click)="openLu2SearchModal('movies')" [hidden]="!isAuthenticated">LU Movie</button>
          <button class="btn btn-lu2" type="button" (click)="openLu2SearchModal('shows')" [hidden]="!isAuthenticated">LU Show</button>
          <button class="btn btn-success" type="button" (click)="startNew()" [hidden]="!isAuthenticated">New Fire Link</button>
        </div>
      </div>
    </div>

    <app-fire-link-list
      [items]="getDisplayedItems()"
      [isAuthenticated]="isAuthenticated"
      [currentTab]="selectedTab"
      (editItem)="editItem($event)"
      (deleteItem)="deleteItem($event)"
      (toggleFavorite)="toggleFavorite($event)"
      (toggleWatched)="toggleWatched($event)"
      (confirmationNeeded)="onConfirmationNeeded($event)"
    ></app-fire-link-list>
    <div class="list-header-row">
      <div class="list-actions">
        <button
          class="scroll-down-btn"
          [hidden]="isModalActive()"
          (click)="scrollToBottom()"
          aria-label="Scroll to bottom">
          ↓
        </button>
      </div>
    </div>
    
  </section>

  <app-fire-link-form
    [visible]="showModal"
    [model]="formModel"
    [existingItems]="items"
    [isEditing]="isEditing"
    [isAuthenticated]="isAuthenticated"
    (save)="save($event)"
    (cancel)="cancel()"
    (delete)="deleteItem($event)"
  ></app-fire-link-form>

  <app-lu2-search-modal
    [visible]="showLu2SearchModal"
    [mode]="lu2Mode"
    [existingItems]="items"
    (closeModal)="onLu2ModalClose()"
    (linkAdded)="onLu2LinkAdded($event)"
  ></app-lu2-search-modal>

</main>

<app-confirmation-toast
  [visible]="showConfirmation"
  [message]="confirmationMessage"
  (confirm)="onConfirmationConfirm()"
  (cancel)="onConfirmationCancel()"
></app-confirmation-toast>
