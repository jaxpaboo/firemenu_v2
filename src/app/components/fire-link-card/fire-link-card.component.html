<article class="card" (mouseenter)="onCardHoverStart()" (mouseleave)="onCardHoverEnd()">
  <a class="card-link" [href]="item.url">
    <img class="card-background" [src]="item.icon || '/fire.ico'" [alt]="item.name" />
    <div class="card-title-overlay">
      <h3 [class.dark-title-bg]="shouldUseDarkTitleBackground">{{ item.name }}</h3>
    </div>
  </a>

  <div class="card-top-left-buttons" *ngIf="isAuthenticated">
    <button 
      class="icon-toggle edit-icon" 
      type="button" 
      (click)="$event.stopPropagation(); onEditClick()"
      (mouseenter)="onActionButtonHoverStart()"
      (mouseleave)="onActionButtonHoverEnd()"
      title="Edit"
      aria-label="Edit">
      ✎
    </button>
    <button 
      class="icon-toggle delete-icon" 
      type="button" 
      (click)="$event.stopPropagation(); onDeleteClick()"
      (mouseenter)="onActionButtonHoverStart()"
      (mouseleave)="onActionButtonHoverEnd()"
      title="Delete"
      aria-label="Delete">
      🗑
    </button>
  </div>

  <div class="card-top-right-buttons" *ngIf="isAuthenticated">
    <button 
      class="icon-toggle favorite-icon" 
      [class.active]="isFavoritePreviewActive"
      type="button" 
      (click)="$event.stopPropagation(); onFavoriteClick()"
      (mouseenter)="onFavoriteHoverStart(); onActionButtonHoverStart()"
      (mouseleave)="onFavoriteHoverEnd(); onActionButtonHoverEnd()"
      title="Toggle Favorite"
      aria-label="Toggle Favorite">
      ★
    </button>
    <button 
      class="icon-toggle watched-icon" 
      [class.active]="isWatchedPreviewActive"
      type="button" 
      (click)="$event.stopPropagation(); onWatchedClick()"
      (mouseenter)="onWatchedHoverStart(); onActionButtonHoverStart()"
      (mouseleave)="onWatchedHoverEnd(); onActionButtonHoverEnd()"
      title="Toggle Watched"
      aria-label="Toggle Watched">
      📺
    </button>
  </div>
</article>
