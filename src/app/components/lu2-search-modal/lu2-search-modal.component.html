<div class="modal-backdrop lu2-modal-backdrop" *ngIf="visible" (click)="closeAndReset()">
  <div class="modal lu2-modal" tabindex="0" (click)="$event.stopPropagation()" (mousemove)="onLu2ModalMouseMove($event)">
    <div class="modal-header">
      <h3>{{ getLu2ModalTitle() }}</h3>
      <button class="close-x-btn" type="button" aria-label="Close" (click)="closeAndReset()">X</button>
    </div>

    <form #lu2ScrollAreaRef class="modal-body lu2-search-body" (ngSubmit)="searchLu2()">
      <div class="lu2-search-row">
        <input
          #lu2SearchInputRef
          id="lu2SearchInput"
          name="lu2SearchInput"
          type="text"
          [(ngModel)]="lu2Query"
          (input)="onLu2QueryInput()"
          [placeholder]="getLu2Placeholder()"
          autocomplete="off"
        />
        <button class="btn btn-primary" type="submit" [disabled]="lu2Loading">{{ lu2Loading ? 'Searching...' : 'Search' }}</button>
      </div>

      <div class="lu2-error" *ngIf="lu2Error">{{ lu2Error }}</div>

      <div class="lu2-results" *ngIf="lu2Results.length > 0">
        <article
          class="lu2-result-card"
          *ngFor="let result of lu2Results; trackBy: trackByLu2Result"
          [ngStyle]="{ 'background-image': 'url(' + getLu2CardBackground(result) + ')' }">
          <div class="lu2-rating">
            <span class="lu2-star">★</span>
            {{ result.imdb_rating || 'N/A' }}
            <span class="lu2-scale" *ngIf="result.imdb_rating">/10</span>
          </div>
          <div class="lu2-year">{{ result.year || 'N/A' }}</div>
          <button class="lu2-play-overlay" type="button" (click)="playLu2Result(result)">Play Movie</button>
          <h4 class="lu2-title">{{ result.title }}</h4>
          <button class="lu2-add-overlay" type="button" (click)="$event.stopPropagation(); addLu2Result(result)">+ Add Link</button>
        </article>
      </div>

      <div class="lu2-no-results-toast" *ngIf="showLu2NoResultsToast">
        <span>No results found. Try a different title.</span>
        <button class="btn btn-outline btn-outline-primary" type="button" (click)="resetLu2SearchForRetry()">Search Again</button>
      </div>
    </form>
  </div>
</div>
