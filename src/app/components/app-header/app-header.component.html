<header class="topbar" (dblclick)="headerDoubleClick.emit($event)" [ngStyle]="{ 'z-index': isModalActive ? 10 : 100 }">
  <div class="brand-section">
    <span class="brand-icon" aria-hidden="true">&#128293;</span>
    <div class="brand">Fire Menu</div>
    <div class="tabs-dropdown" [class.open]="showTabsMenu" aria-label="Primary navigation">
      <button class="tab-toggle" type="button" aria-haspopup="true" [attr.aria-expanded]="showTabsMenu" (click)="toggleTabsMenu()">
        {{ getCurrentTabLabel() }}
      </button>
      <div class="dropdown-menu">
        <button
          *ngFor="let tab of tabs"
          [class.active]="selectedTab === tab.value"
          class="dropdown-item"
          type="button"
          (click)="onSelectTab(tab.value)">
          {{ tab.label }}
        </button>
      </div>
    </div>
    <button
      *ngIf="!isAuthenticated"
      class="btn btn-outline btn-outline-primary"
      type="button"
      (click)="loginClick.emit()">
      Login
    </button>
  </div>

  <div class="header-controls">
    <div class="settings-menu">
      <button
        class="gear-btn"
        type="button"
        aria-label="Open settings menu"
        aria-haspopup="true"
        [attr.aria-expanded]="showSettingsMenu"
        (click)="toggleSettingsMenu()">
        &#9881;
      </button>

      <div class="settings-dropdown" *ngIf="showSettingsMenu">
        <label class="settings-item settings-toggle">
          <input
            type="checkbox"
            [checked]="enableDebug"
            (change)="onEnableDebugToggle($event)"
            aria-label="ENABLE DEBUG overlay" />
          <span>ENABLE DEBUG</span>
        </label>
        <button *ngIf="isAuthenticated" class="settings-item" type="button" (click)="onLogoutClick()">
          Logout
        </button>
        <div class="settings-version">v{{ appVersion }}</div>
      </div>
    </div>
  </div>
</header>
